<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Acerca De
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Tab Acerca De</ion-title>
    </ion-toolbar>
  </ion-header>

  <h2>Lista Estática</h2>
  <ion-list>
    <ion-item>
      <ion-label>Sandía</ion-label>
    </ion-item>
    <ion-item>
      <ion-label>Naranja</ion-label>
    </ion-item>
    <ion-item>
      <ion-label>Fresa</ion-label>
    </ion-item>
    <ion-item>
      <ion-label>Melón</ion-label>
    </ion-item>
    <ion-item>
      <ion-label>Manzana</ion-label>
    </ion-item>
  </ion-list>

  <h2>Lista Dinámica</h2>
  <ion-list>
    @for (item of lista; track $index) {
      <ion-item>
        <h5>{{ item.name }}</h5>
      </ion-item>
    }
  </ion-list>
</ion-content>
