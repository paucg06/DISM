<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz · Tema 3.1 Dispositivos móviles (conceptos)</title>
<style>
  :root{
    --bg:#0f1115;
    --card:#171a21;
    --card-border:#262b36;
    --accent:#5b8def;
    --accent-2:#7c5cff;
    --good:#33c07d;
    --bad:#e2524d;
    --text:#e9ecf1;
    --muted:#93a0b4;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 800px at 10% -10%, #1b2030 0%, var(--bg) 55%);
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:32px 16px 60px;
  }
  .app{width:100%;max-width:760px;}
  header{
    text-align:center;
    margin-bottom:24px;
  }
  header h1{
    font-size:1.5rem;
    margin:0 0 6px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  header p{margin:0;color:var(--muted);font-size:0.92rem;}

  .progress-wrap{
    background:var(--card-border);
    border-radius:999px;
    height:8px;
    margin:18px 0 28px;
    overflow:hidden;
  }
  .progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    transition:width .35s ease;
  }

  .card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:var(--radius);
    padding:26px 24px;
    box-shadow:0 10px 30px rgba(0,0,0,0.35);
  }

  .qmeta{
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:var(--muted);
    font-size:0.85rem;
    margin-bottom:10px;
  }
  .qmeta .score-live{
    font-weight:600;
    color:var(--accent);
  }

  .question-text{
    font-size:1.12rem;
    line-height:1.5;
    margin:0 0 20px;
    font-weight:600;
  }

  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .option{
    text-align:left;
    background:#1e2330;
    border:1px solid var(--card-border);
    color:var(--text);
    padding:13px 16px;
    border-radius:12px;
    cursor:pointer;
    font-size:0.98rem;
    line-height:1.4;
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .option:hover:not(.disabled){
    border-color:var(--accent);
    background:#232a3a;
  }
  .option.selected-correct{
    background:rgba(51,192,125,0.15);
    border-color:var(--good);
  }
  .option.selected-wrong{
    background:rgba(226,82,77,0.15);
    border-color:var(--bad);
  }
  .option.reveal-correct{
    border-color:var(--good);
  }
  .option.disabled{
    cursor:default;
  }

  .feedback{
    margin-top:16px;
    font-size:0.9rem;
    color:var(--muted);
    min-height:1.2em;
  }
  .feedback.good{color:var(--good);}
  .feedback.bad{color:var(--bad);}

  .nav{
    display:flex;
    justify-content:flex-end;
    margin-top:22px;
  }
  button.primary{
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    color:#fff;
    border:none;
    padding:11px 22px;
    border-radius:10px;
    font-size:0.95rem;
    font-weight:600;
    cursor:pointer;
    opacity:0.4;
    pointer-events:none;
    transition:opacity .15s ease;
  }
  button.primary.active{
    opacity:1;
    pointer-events:auto;
  }
  button.primary:hover.active{
    filter:brightness(1.08);
  }

  /* Results screen */
  .results{
    text-align:center;
  }
  .results h2{
    font-size:1.3rem;
    margin-bottom:4px;
  }
  .grade{
    font-size:3.6rem;
    font-weight:800;
    margin:14px 0 6px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .grade-sub{color:var(--muted);margin-bottom:22px;font-size:0.95rem;}
  .stats-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin:20px 0 28px;
  }
  .stat{
    background:#1e2330;
    border:1px solid var(--card-border);
    border-radius:12px;
    padding:14px 8px;
  }
  .stat .num{font-size:1.4rem;font-weight:700;}
  .stat.ok .num{color:var(--good);}
  .stat.bad .num{color:var(--bad);}
  .stat.skip .num{color:var(--muted);}
  .stat .label{font-size:0.75rem;color:var(--muted);margin-top:2px;}

  .actions{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
  }
  button.secondary{
    background:transparent;
    border:1px solid var(--card-border);
    color:var(--text);
    padding:11px 20px;
    border-radius:10px;
    cursor:pointer;
    font-size:0.9rem;
  }
  button.secondary:hover{border-color:var(--accent);}

  .review{
    text-align:left;
    margin-top:30px;
    border-top:1px solid var(--card-border);
    padding-top:20px;
  }
  .review h3{font-size:1rem;margin-bottom:14px;color:var(--muted);}
  .review-item{
    background:#1e2330;
    border:1px solid var(--card-border);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:10px;
    font-size:0.88rem;
  }
  .review-item .rq{font-weight:600;margin-bottom:6px;}
  .review-item .ra-good{color:var(--good);}
  .review-item .ra-bad{color:var(--bad);}

  footer{
    text-align:center;
    color:var(--muted);
    font-size:0.75rem;
    margin-top:26px;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Tema 3.1 · Dispositivos móviles</h1>
    <p>Conceptos, funcionamiento y comparativas — sin preguntas de fechas</p>
  </header>

  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

  <div class="card" id="quizCard"></div>

  <footer>Cada fallo resta 1/3 de una pregunta correcta · Nota final sobre 10</footer>
</div>

<script>
const QUESTIONS = [
  {q:"¿Cuál fue la razón principal del éxito inicial de los teléfonos móviles según el tema?",
   options:["Su bajo precio de fabricación",
            "La posibilidad de estar conectado a la red telefónica desde cualquier sitio",
            "Su diseño compacto y ligero",
            "La duración de su batería"], correct:1},
  {q:"¿Qué distingue a un smartphone de un teléfono móvil anterior según el tema?",
   options:["Únicamente que tiene pantalla táctil",
            "Un aumento significativo de potencia y un SO especializado en interactividad multimedia",
            "Que no necesita conexión a ninguna red",
            "Que solo permite llamadas y mensajes"], correct:1},
  {q:"¿Cuál es la diferencia clave entre iOS y Android en cuanto a fabricantes?",
   options:["iOS es abierto a cualquier fabricante y Android es cerrado",
            "Android permite su uso a cualquier fabricante mientras iOS se mantuvo privado de Apple",
            "Ambos sistemas son completamente abiertos",
            "Ambos sistemas son privados de sus creadores"], correct:1},
  {q:"Aunque existían precedentes de tablets anteriores, ¿qué hizo especial al iPad según el tema?",
   options:["Fue el primero en tener pantalla táctil",
            "Fue el primero en calar y dar utilidad real a la sociedad",
            "Fue el único que funcionaba sin batería",
            "Fue el primero en usar Android"], correct:1},
  {q:"¿Cuáles son los atributos físicos que hacen que un wearable convenza al público?",
   options:["Multifuncional, configurable y adaptable",
            "Ligero, poco visible, cómodo y estéticamente atractivo",
            "Barato, resistente y duradero",
            "Rápido, seguro y portátil"], correct:1},
  {q:"¿Cuáles son los atributos funcionales que caracterizan a los wearables?",
   options:["Ligero, poco visible y cómodo",
            "Multifuncional, configurable y adaptable",
            "Estético, barato y resistente",
            "Duradero, portátil y silencioso"], correct:1},
  {q:"¿Por qué el Seiko TV Watch no se considera un wearable exitoso pese a ser un smartwatch?",
   options:["Porque no podía dar la hora correctamente",
            "Porque era aparatoso por su tamaño y cables, y su estética estaba poco estudiada",
            "Porque no era resistente al agua",
            "Porque no tenía ninguna función además de la hora"], correct:1},
  {q:"Según el tema, ¿cuál es uno de los principales retos técnicos de los wearables?",
   options:["Reducir su precio de venta al público",
            "La necesidad de una interfaz común y sensores asequibles",
            "Eliminar por completo la batería",
            "Que dejen de ser resistentes al agua"], correct:1},
  {q:"¿En qué se basa el funcionamiento de las pantallas táctiles capacitativas?",
   options:["En la presión física ejercida sobre la pantalla",
            "En la conductividad del cuerpo humano, que altera un campo eléctrico",
            "En un haz de infrarrojos que detecta el dedo",
            "En ondas acústicas que rebotan en la superficie"], correct:1},
  {q:"¿Qué tecnología de pantalla táctil se utilizó en los primeros smartphones?",
   options:["Capacitativa","Resistiva","Infrarrojos","Imagen óptica"], correct:1},
  {q:"¿Cómo funcionan las pantallas resistivas frente a las capacitativas?",
   options:["Usan dos capas finas de material conductor que entran en contacto al presionar",
            "Detectan la conductividad natural del cuerpo humano",
            "Emiten un campo eléctrico permanente",
            "Solo funcionan con un lápiz óptico especial"], correct:0},
  {q:"¿Cuál es la principal desventaja de los displays LCD frente a otras tecnologías más modernas?",
   options:["Son muy caros de producir",
            "Consumen mucha energía pese a ser baratos de fabricar",
            "No pueden mostrar colores",
            "Solo funcionan en dispositivos grandes"], correct:1},
  {q:"¿Qué diferencia principal hay entre el display TFT y su evolución IPS?",
   options:["El IPS es visible desde mayores ángulos y consume menos energía",
            "El TFT tiene mejor resolución que el IPS",
            "El IPS no puede usarse en teléfonos móviles",
            "El TFT consume menos energía que el IPS"], correct:0},
  {q:"¿Qué caracteriza a la tecnología AMOLED frente a un display LCD tradicional?",
   options:["Es más barato de producir pero consume más energía",
            "Es más fino, sin retroiluminación, con mejores colores y menor consumo, aunque más caro",
            "Usa cristal líquido en lugar de diodos",
            "Tiene menor contraste que el LCD"], correct:1},
  {q:"¿Por qué los dispositivos móviles actuales priorizan la conectividad inalámbrica sobre la alámbrica?",
   options:["Porque las conexiones alámbricas no existen para móviles",
            "Porque los cables reducirían su ventajosa portabilidad",
            "Porque el WiFi es más barato de fabricar que un cable",
            "Porque las conexiones alámbricas consumen más batería"], correct:1},
  {q:"¿Para qué se utiliza principalmente el estándar IrDA?",
   options:["Para la comunicación por radiofrecuencia de largo alcance",
            "Para la emisión y recepción de datos por infrarrojos",
            "Para el pago sin contacto en TPV",
            "Para conectar routers inalámbricos entre sí"], correct:1},
  {q:"¿Qué función cumple el Bluetooth entre dispositivos de arquitectura muy distinta?",
   options:["Ofrece una interfaz que gestiona la conexión y la transmisión de datos",
            "Solo permite la transferencia de archivos de audio",
            "Sustituye por completo al WiFi en todos los casos",
            "Funciona únicamente entre dispositivos idénticos"], correct:0},
  {q:"¿Qué caracteriza principalmente al protocolo ANT frente a otros protocolos inalámbricos?",
   options:["Su gran alcance y alta velocidad de transmisión",
            "Su bajo consumo y facilidad de uso, muy presente en redes IoT",
            "Su exclusividad para pagos móviles",
            "Que solo puede transmitir datos por infrarrojos"], correct:1},
  {q:"¿En qué contexto se utiliza principalmente el protocolo Zigbee?",
   options:["En pagos móviles sin contacto",
            "En domótica, ya que maximiza la vida útil de los dispositivos",
            "En la transmisión de vídeo en alta definición",
            "En redes móviles de telefonía"], correct:1},
  {q:"¿Qué significa que los estándares WiFi sean 'retrocompatibles'?",
   options:["Que dejan de funcionar con dispositivos antiguos",
            "Que un estándar nuevo puede comunicarse con uno anterior",
            "Que solo funcionan con un fabricante concreto",
            "Que necesitan cables para funcionar"], correct:1},
  {q:"Entre los estándares WiFi A y B, ¿qué diferencia existe en cuanto a banda e interferencias?",
   options:["El estándar A opera en 5GHz, con menor alcance pero también menos interferencias",
            "El estándar B tiene mayor velocidad que el A",
            "Ambos operan exactamente en la misma banda",
            "El estándar A no puede coexistir con ningún otro"], correct:0},
  {q:"¿Cuál es la función de un punto de acceso (AP) en una red WiFi?",
   options:["Extender la cobertura de otro punto de acceso",
            "Generar una red WiFi y permitir el acceso inalámbrico dentro de sus límites",
            "Actuar únicamente como tarjeta receptora",
            "Sustituir al router alámbrico sin generar red inalámbrica"], correct:1},
  {q:"¿Qué diferencia a un router inalámbrico de un simple punto de acceso?",
   options:["El router inalámbrico combina un router alámbrico, un AP y un switch",
            "El punto de acceso también hace de router alámbrico",
            "No existe ninguna diferencia entre ambos",
            "El router inalámbrico solo extiende la señal de otro dispositivo"], correct:0},
  {q:"¿Cuál es la función de un repetidor en una red WiFi?",
   options:["Generar una red WiFi completamente nueva",
            "Extender la cobertura que ya ofrece un punto de acceso",
            "Sustituir a la tarjeta receptora del dispositivo",
            "Cifrar el tráfico de la red con WPA"], correct:1},
  {q:"Según la tabla de ventajas y desventajas del tema, ¿qué desventaja tienen las conexiones inalámbricas frente a las alámbricas?",
   options:["Mayor velocidad de conexión",
            "Menor velocidad y más problemas de seguridad, necesitando cifrado extra",
            "Mayor coste de cableado",
            "Menor compatibilidad con dispositivos antiguos únicamente"], correct:1},
  {q:"¿Cómo almacena y transmite la información un sistema RFID?",
   options:["Mediante un microchip unido a una antena que transmite la información",
            "Mediante ondas de infrarrojos exclusivamente",
            "Mediante un código QR impreso",
            "Mediante una conexión Bluetooth permanente"], correct:0},
  {q:"¿Cuál es la relación correcta entre RFID y NFC?",
   options:["NFC es compatible con RFID y puede leer sus etiquetas directamente",
            "NFC es una extensión de RFID para distancias muy cortas, pero ambas son incompatibles entre sí",
            "RFID es una extensión de NFC de mayor alcance",
            "Ambas tecnologías son idénticas y totalmente intercambiables"], correct:1},
  {q:"¿Para qué se utiliza habitualmente el NFC en los teléfonos móviles?",
   options:["Para realizar pagos sin contacto en máquinas TPV",
            "Para conectar el teléfono a redes WiFi de largo alcance",
            "Para transmitir vídeo en alta definición",
            "Para sustituir por completo al Bluetooth en cualquier uso"], correct:0}
];

// Fisher-Yates shuffle
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

// Build runtime quiz with shuffled options per question
const quiz = QUESTIONS.map(item=>{
  const correctText = item.options[item.correct];
  const shuffled = shuffle(item.options);
  return {
    q:item.q,
    options:shuffled,
    correctText:correctText
  };
});

let current = 0;
let answered = [];       // stores {chosen, correctText, isCorrect} per question
let selectedOption = null;

const card = document.getElementById('quizCard');
const progressBar = document.getElementById('progressBar');

function renderQuestion(){
  const item = quiz[current];
  progressBar.style.width = ((current)/quiz.length*100) + "%";

  const correctSoFar = answered.filter(a=>a.isCorrect).length;
  const wrongSoFar = answered.filter(a=>!a.isCorrect).length;
  const liveScore = (correctSoFar - wrongSoFar/3).toFixed(2);

  card.innerHTML = `
    <div class="qmeta">
      <span>Pregunta ${current+1} / ${quiz.length}</span>
      <span class="score-live">Puntos: ${liveScore}</span>
    </div>
    <p class="question-text">${item.q}</p>
    <div class="options" id="optionsWrap"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="primary" id="nextBtn">Siguiente</button></div>
  `;

  const optionsWrap = document.getElementById('optionsWrap');
  item.options.forEach(optText=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = optText;
    btn.addEventListener('click', ()=>selectOption(optText, btn));
    optionsWrap.appendChild(btn);
  });

  document.getElementById('nextBtn').addEventListener('click', nextQuestion);
  selectedOption = null;
}

function selectOption(optText, btnEl){
  if(selectedOption !== null) return; // already answered this question
  const item = quiz[current];
  const isCorrect = optText === item.correctText;
  selectedOption = optText;

  const allBtns = document.querySelectorAll('#optionsWrap .option');
  allBtns.forEach(b=>{
    b.classList.add('disabled');
    if(b.textContent === item.correctText){
      b.classList.add('reveal-correct');
    }
    if(b === btnEl && !isCorrect){
      b.classList.add('selected-wrong');
    }
    if(b === btnEl && isCorrect){
      b.classList.add('selected-correct');
    }
  });

  const feedback = document.getElementById('feedback');
  if(isCorrect){
    feedback.textContent = "✓ Correcto";
    feedback.className = "feedback good";
  } else {
    feedback.textContent = "✗ Incorrecto — la respuesta correcta está resaltada en verde";
    feedback.className = "feedback bad";
  }

  answered[current] = {
    question:item.q,
    chosen:optText,
    correctText:item.correctText,
    isCorrect:isCorrect
  };

  document.getElementById('nextBtn').classList.add('active');
}

function nextQuestion(){
  if(selectedOption === null) return;
  current++;
  if(current < quiz.length){
    renderQuestion();
  } else {
    renderResults();
  }
}

function renderResults(){
  progressBar.style.width = "100%";
  const correctCount = answered.filter(a=>a && a.isCorrect).length;
  const wrongCount = answered.filter(a=>a && !a.isCorrect).length;
  const skipped = quiz.length - answered.length;

  const rawScore = correctCount - (wrongCount/3);
  const nota = Math.max(0, (rawScore/quiz.length)*10);
  const notaStr = nota.toFixed(2);

  let gradeMsg = "";
  if(nota >= 9) gradeMsg = "¡Excelente dominio del tema!";
  else if(nota >= 7) gradeMsg = "Muy buen resultado.";
  else if(nota >= 5) gradeMsg = "Aprobado, pero repasa los fallos.";
  else gradeMsg = "Conviene repasar el tema de nuevo.";

  const reviewHTML = answered.map((a,i)=>{
    if(!a) return "";
    return `
      <div class="review-item">
        <div class="rq">${i+1}. ${a.question}</div>
        <div class="${a.isCorrect ? 'ra-good' : 'ra-bad'}">Tu respuesta: ${a.chosen}</div>
        ${!a.isCorrect ? `<div class="ra-good">Correcta: ${a.correctText}</div>` : ""}
      </div>
    `;
  }).join("");

  card.innerHTML = `
    <div class="results">
      <h2>Resultado final</h2>
      <div class="grade">${notaStr}</div>
      <div class="grade-sub">${gradeMsg}</div>
      <div class="stats-grid">
        <div class="stat ok"><div class="num">${correctCount}</div><div class="label">Correctas</div></div>
        <div class="stat bad"><div class="num">${wrongCount}</div><div class="label">Falladas</div></div>
        <div class="stat skip"><div class="num">${skipped}</div><div class="label">Sin responder</div></div>
      </div>
      <div class="actions">
        <button class="secondary" onclick="location.reload()">Repetir test</button>
      </div>
      <div class="review">
        <h3>Repaso de preguntas</h3>
        ${reviewHTML}
      </div>
    </div>
  `;
}

renderQuestion();
</script>
</body>
</html>
