<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>Quiz · Tema 3.2 Infraestructura de la telefonía móvil</title>
<style>
  :root{
    --bg:#0f1115;
    --card:#171a21;

    --accent:#5b8def;

    --good:#33c07d;

    --text:#e9ecf1;
    --muted:#93a0b4;

  }

    margin:0;
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 800px at 10% -10%, #1b2030 0%, var(--bg) 55%);
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:32px 16px 60px;
  }
  .app{width:100%;max-width:780px;}
  header{
    text-align:center;
    margin-bottom:24px;
  }
  header h1{
    font-size:1.45rem;
    margin:0 0 6px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));

    background-clip:text;
    color:transparent;
  }
  header p{margin:0;color:var(--muted);font-size:0.92rem;}

  .progress-wrap{
    background:var(--card-border);
    border-radius:999px;
    height:8px;
    margin:18px 0 28px;
    overflow:hidden;
  }
  .progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));

  }

  .card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:var(--radius);
    padding:26px 24px;
    box-shadow:0 10px 30px rgba(0,0,0,0.35);
  }

  .qmeta{
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:var(--muted);
    font-size:0.85rem;
    margin-bottom:10px;

    font-weight:600;
    color:var(--accent);
  }
  .tag{
    display:inline-block;
    font-size:0.68rem;
    font-weight:700;
    letter-spacing:0.03em;
    text-transform:uppercase;
    padding:3px 8px;
    border-radius:999px;
    margin-bottom:10px;
  }

  .tag.theory{background:rgba(91,141,239,0.18);color:#9dbdf6;}

  .question-text{

    line-height:1.5;
    margin:0 0 20px;
    font-weight:600;
    white-space:pre-line;
  }

  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .option{
    text-align:left;
    background:#1e2330;
    border:1px solid var(--card-border);
    color:var(--text);
    padding:13px 16px;
    border-radius:12px;
    cursor:pointer;
    font-size:0.98rem;
    line-height:1.4;

    border-color:var(--accent);
    background:#232a3a;
  }
  .option.selected-correct{
    background:rgba(51,192,125,0.15);
    border-color:var(--good);
  }
  .option.selected-wrong{
    background:rgba(226,82,77,0.15);
    border-color:var(--bad);
  }
  .option.reveal-correct{
    border-color:var(--good);
  }
  .option.disabled{
    cursor:default;
  }

  .feedback{
    margin-top:16px;
    font-size:0.9rem;
    color:var(--muted);
    min-height:1.2em;
  }
  .feedback.good{color:var(--good);}
  .feedback.bad{color:var(--bad);}

  .nav{
    display:flex;
    justify-content:flex-end;
    margin-top:22px;
  }
  button.primary{
    background:linear-gradient(90deg,var(--accent),var(--accent-2));

    border:none;
    padding:11px 22px;
    border-radius:10px;
    font-size:0.95rem;
    font-weight:600;
    cursor:pointer;
    opacity:0.4;
    pointer-events:none;
    transition:opacity .15s ease;
  }
  button.primary.active{
    opacity:1;
    pointer-events:auto;
  }
  button.primary:hover.active{
    filter:brightness(1.08);
  }

  .results{
    text-align:center;
  }
  .results h2{
    font-size:1.3rem;
    margin-bottom:4px;
  }
  .grade{
    font-size:3.6rem;
    font-weight:800;
    margin:14px 0 6px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));

    background-clip:text;
    color:transparent;
  }
  .grade-sub{color:var(--muted);margin-bottom:22px;font-size:0.95rem;}
  .stats-grid{
    display:grid;

    gap:12px;
    margin:20px 0 28px;
  }
  .stat{
    background:#1e2330;
    border:1px solid var(--card-border);
    border-radius:12px;
    padding:14px 8px;
  }
  .stat .num{font-size:1.4rem;font-weight:700;}
  .stat.ok .num{color:var(--good);}
  .stat.bad .num{color:var(--bad);}
  .stat.skip .num{color:var(--muted);}
  .stat .label{font-size:0.75rem;color:var(--muted);margin-top:2px;}

  .actions{

    gap:10px;

    flex-wrap:wrap;

  button.secondary{
    background:transparent;

    color:var(--text);
    padding:11px 20px;
    border-radius:10px;
    cursor:pointer;
    font-size:0.9rem;
  }
  button.secondary:hover{border-color:var(--accent);}

  .review{

    margin-top:30px;

  }

  .review-item{

    padding:12px 14px;
    margin-bottom:10px;

  }
  .review-item .rq{font-weight:600;margin-bottom:6px;white-space:pre-line;}
  .review-item .ra-good{color:var(--good);}
  .review-item .ra-bad{color:var(--bad);}

  footer{
    text-align:center;
    color:var(--muted);
    font-size:0.75rem;
    margin-top:26px;
  }
</style>

// Fisher-Yates shuffle
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

// Build runtime quiz with shuffled options per question
const quiz = QUESTIONS.map(item=>{
  const correctText = item.options[item.correct];
  const shuffled = shuffle(item.options);
  return {
    tag:item.tag,
    q:item.q,
    options:shuffled,
    correctText:correctText
  };
});

let current = 0;
let answered = [];
let selectedOption = null;

const card = document.getElementById('quizCard');
const progressBar = document.getElementById('progressBar');

function renderQuestion(){
  const item = quiz[current];
  progressBar.style.width = ((current)/quiz.length*100) + "%";

  const correctSoFar = answered.filter(a=>a.isCorrect).length;
  const wrongSoFar = answered.filter(a=>!a.isCorrect).length;
  const liveScore = (correctSoFar - wrongSoFar/3).toFixed(2);

  const tagLabel = item.tag === "calc" ? '<span class="tag calc">Ejercicio de cálculo</span>' : '<span class="tag theory">Teoría</span>';

  card.innerHTML = `
    <div class="qmeta">
      <span>Pregunta ${current+1} / ${quiz.length}</span>
      <span class="score-live">Puntos: ${liveScore}</span>
    </div>
    ${tagLabel}
    <p class="question-text">${item.q}</p>
    <div class="options" id="optionsWrap"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="primary" id="nextBtn">Siguiente</button></div>
  `;

  const optionsWrap = document.getElementById('optionsWrap');
  item.options.forEach(optText=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = optText;
    btn.addEventListener('click', ()=>selectOption(optText, btn));
    optionsWrap.appendChild(btn);
  });

  document.getElementById('nextBtn').addEventListener('click', nextQuestion);
  selectedOption = null;
}

function selectOption(optText, btnEl){
  if(selectedOption !== null) return;
  const item = quiz[current];
  const isCorrect = optText === item.correctText;
  selectedOption = optText;

  const allBtns = document.querySelectorAll('#optionsWrap .option');
  allBtns.forEach(b=>{
    b.classList.add('disabled');
    if(b.textContent === item.correctText){
      b.classList.add('reveal-correct');
    }
    if(b === btnEl && !isCorrect){
      b.classList.add('selected-wrong');
    }
    if(b === btnEl && isCorrect){
      b.classList.add('selected-correct');
    }
  });

  const feedback = document.getElementById('feedback');
  if(isCorrect){
    feedback.textContent = "✓ Correcto";
    feedback.className = "feedback good";
  } else {
    feedback.textContent = "✗ Incorrecto — la respuesta correcta está resaltada en verde";
    feedback.className = "feedback bad";
  }

  answered[current] = {
    question:item.q,
    chosen:optText,
    correctText:item.correctText,
    isCorrect:isCorrect
  };

  document.getElementById('nextBtn').classList.add('active');
}

function nextQuestion(){
  if(selectedOption === null) return;
  current++;
  if(current < quiz.length){
    renderQuestion();
  } else {
    renderResults();
  }
}

function renderResults(){
  progressBar.style.width = "100%";
  const correctCount = answered.filter(a=>a && a.isCorrect).length;
  const wrongCount = answered.filter(a=>a && !a.isCorrect).length;
  const skipped = quiz.length - answered.length;

  const rawScore = correctCount - (wrongCount/3);
  const nota = Math.max(0, (rawScore/quiz.length)*10);
  const notaStr = nota.toFixed(2);

  let gradeMsg = "";
  if(nota >= 9) gradeMsg = "¡Excelente dominio del tema!";
  else if(nota >= 7) gradeMsg = "Muy buen resultado.";
  else if(nota >= 5) gradeMsg = "Aprobado, pero repasa los fallos.";
  else gradeMsg = "Conviene repasar el tema de nuevo.";

  const reviewHTML = answered.map((a,i)=>{
    if(!a) return "";
    return `
      <div class="review-item">
        <div class="rq">${i+1}. ${a.question}</div>
        <div class="${a.isCorrect ? 'ra-good' : 'ra-bad'}">Tu respuesta: ${a.chosen}</div>
        ${!a.isCorrect ? `<div class="ra-good">Correcta: ${a.correctText}</div>` : ""}
      </div>
    `;
  }).join("");

  card.innerHTML = `
    <div class="results">
      <h2>Resultado final</h2>
      <div class="grade">${notaStr}</div>
      <div class="grade-sub">${gradeMsg}</div>
      <div class="stats-grid">
        <div class="stat ok"><div class="num">${correctCount}</div><div class="label">Correctas</div></div>
        <div class="stat bad"><div class="num">${wrongCount}</div><div class="label">Falladas</div></div>
        <div class="stat skip"><div class="num">${skipped}</div><div class="label">Sin responder</div></div>
      </div>
      <div class="actions">
        <button class="secondary" onclick="location.reload()">Repetir test</button>
      </div>
      <div class="review">
        <h3>Repaso de preguntas</h3>
        ${reviewHTML}
      </div>
    </div>
  `;
}

renderQuestion();
</script>
</body>
</html>
