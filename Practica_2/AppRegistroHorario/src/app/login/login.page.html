<ion-header [translucent]="true">
  <ion-toolbar color="medium">
    <ion-title>Control Horario</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="login-content ion-padding">
  <div class="login-container">

    <div class="login-header">
      <div class="login-icon-box">
        <ion-icon name="time-outline"></ion-icon>
      </div>
      <h2>Control Horario</h2>
      <p>Introduce tu usuario y contraseña para acceder</p>
    </div>

    <ion-card class="login-card">
      <ion-card-content>
        <ion-item lines="full" class="login-item">
          <ion-icon name="person-outline" slot="start" color="medium"></ion-icon>
          <ion-label position="stacked">Usuario</ion-label>
          <ion-input [(ngModel)]="usuario" placeholder="Introduce tu usuario"></ion-input>
        </ion-item>

        <ion-item lines="full" class="login-item" style="margin-top: 15px;">
          <ion-icon name="lock-closed-outline" slot="start" color="medium"></ion-icon>
          <ion-label position="stacked">Contraseña</ion-label>
          <ion-input [(ngModel)]="clave" type="password" placeholder="Introduce tu contraseña"></ion-input>
        </ion-item>

        <ion-button expand="block" color="medium" (click)="onLogin()" [disabled]="cargando" class="login-btn">
          <ion-spinner *ngIf="cargando" slot="start"></ion-spinner>
          Iniciar Sesión
        </ion-button>
      </ion-card-content>
    </ion-card>

  </div>
</ion-content>
