<ion-header [translucent]="true">
  <ion-toolbar color="success">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Gestión de Trabajos</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="nuevoTrabajo()" title="Añadir Trabajo">
        <ion-icon slot="icon-only" name="add-circle-outline"></ion-icon>
      </ion-button>
      <ion-button (click)="logout()" fill="clear" color="light" title="Cerrar sesión">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list style="border-radius: 12px; overflow: hidden;">
    <ion-item *ngFor="let t of trabajos" button (click)="verDetalle(t)">
      <ion-avatar slot="start">
        <ion-icon name="briefcase-outline" style="font-size: 35px; color: var(--ion-color-success);"></ion-icon>
      </ion-avatar>
      <ion-label>
        <h2>{{ t.Nombre }}</h2>
        <p>Código Trabajo: #{{ t.IdTrabajo }}</p>
      </ion-label>
      <ion-button fill="clear" color="danger" slot="end" (click)="$event.stopPropagation(); confirmarEliminar(t.IdTrabajo)">
        <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>

  <ion-button expand="block" color="success" (click)="nuevoTrabajo()" style="margin-top: 20px; height: 46px; font-weight: 600;">
    <ion-icon slot="start" name="add-outline"></ion-icon>
    Crear Nuevo Trabajo
  </ion-button>

  <!-- Modal Detalle / Edición / Creación -->
  <ion-modal [isOpen]="mostrarModal" (didDismiss)="cerrarModal()">
    <ng-template>
      <ion-header>
        <ion-toolbar color="success">
          <ion-title>{{ trabajoSeleccionado?.IdTrabajo ? 'Detalle Trabajo' : 'Nuevo Trabajo' }}</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="cerrarModal()" fill="clear" color="light">Cerrar</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding" *ngIf="trabajoSeleccionado">
        <ion-item lines="full">
          <ion-label position="stacked">ID Trabajo (Numérico, Obligatorio)</ion-label>
          <ion-input [(ngModel)]="trabajoSeleccionado.IdTrabajo" type="number"></ion-input>
        </ion-item>

        <ion-item lines="full" style="margin-top: 15px;">
          <ion-label position="stacked">Nombre del Trabajo / Proyecto</ion-label>
          <ion-input [(ngModel)]="trabajoSeleccionado.Nombre" placeholder="Ej: Auditoría de Sistemas"></ion-input>
        </ion-item>

        <ion-button expand="block" color="success" (click)="guardarTrabajo()" style="margin-top: 25px; height: 46px; font-weight: 600;">
          Guardar Trabajo
        </ion-button>
      </ion-content>
    </ng-template>
  </ion-modal>
</ion-content>
