<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <title>Control Horario</title>

  <base href="/" />

  <meta name="color-scheme" content="light" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- Iconos de Pestaña y Navegador (Cache-busting con versionado directo) -->
  <link rel="icon" type="image/png" href="assets/icon/favicon.png?v=2" />
  <link rel="shortcut icon" type="image/png" href="assets/icon/favicon.png?v=2" />
  <link rel="apple-touch-icon" href="assets/icon/icon-192.png?v=2" />

  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#475569" />

  <!-- Compatibilidad PWA -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ControlHorario" />

  <!-- Desregistro de Service Workers antiguos -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
    }
  </script>
</head>

<body>
  <app-root></app-root>
</body>

</html>
